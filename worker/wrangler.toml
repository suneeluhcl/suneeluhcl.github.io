# worker/wrangler.toml
name = "portfolio-chat-worker"
main = "src/index.js"
compatibility_date = "2025-07-01"
# nodejs_compat lets the Anthropic SDK run on the Workers runtime.
compatibility_flags = ["nodejs_compat"]

[build]
command = "node ../scripts/gen-resume-context.mjs"

# API keys are secrets, NOT stored here. Set them once with:
#   cd worker && npx wrangler secret put ANTHROPIC_API_KEY
#   (create the key at https://console.anthropic.com/settings/keys)
#   cd worker && npx wrangler secret put RESEND_API_KEY
#   (create the key at https://resend.com/api-keys — see worker/README.md for the
#    domain-verification step the contact form needs)

[vars]
# Keep Anthropic as the live default. Set this to "openai" and store OPENAI_API_KEY
# as a Wrangler secret to switch providers without changing the frontend.
AI_PROVIDER = "anthropic"
OPENAI_MODEL = "gpt-5.6-luna"
# Where contact-form submissions are delivered.
CONTACT_TO = "suneeluhcl@gmail.com"
# Must be an address on a domain verified in Resend, otherwise sending fails.
CONTACT_FROM = "Portfolio <portfolio@suneelkumarbikkasani.com>"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
    limit = 20
    period = 60

# Chat question log — what visitors asked and what the assistant answered.
# Stores no IP, user agent, or identifier. See schema.sql.
#
# Disabled until the database exists, because wrangler rejects a blank
# database_id at deploy time. To turn it on (from worker/):
#   npx wrangler d1 create portfolio-chat-log
#   npx wrangler d1 execute portfolio-chat-log --remote --file=./schema.sql
# then uncomment the block below, paste in the printed database_id, and redeploy.
# While it stays commented out the binding is simply absent and logging no-ops —
# the chat itself is unaffected either way.
#
# [[d1_databases]]
# binding = "CHAT_LOG"
# database_name = "portfolio-chat-log"
# database_id = "<paste the id printed by `wrangler d1 create`>"
