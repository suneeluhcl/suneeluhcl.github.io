        - paragraph [ref=e118]: // 01. about
        - heading "About Me." [level=2] [ref=e119]
      - generic [ref=e122]:
        - generic [ref=e123]: "suneel@dev: ~/about — less README.md"
        - generic [ref=e128]:
          - paragraph [ref=e130]: ">I'm a senior engineer with a decade of experience turning complex business problems into clean, resilient software. Today I work in Capital One's Payments Fulfillment domain, building the systems that fulfill every credit card payment — ACH, debit, check, balance transfers, and cross-border EFT — processing millions of financial transactions per day."
          - paragraph [ref=e132]: ">My foundation is modern Java: I led my team's first production migration to Java 21 and Spring Boot 4, and I've driven Java 8 → 17 modernizations, Jakarta EE 10 upgrades, and zero-downtime monolith decompositions. But I'm deliberately polyglot — production Go, Python, and TypeScript microservices, plus big-data pipelines in Apache Spark on EMR, Databricks, Kafka, and Flink SQL feeding Snowflake and OneLake."
          - paragraph [ref=e134]: ">Security isn't an afterthought in my work — it's the architecture. OAuth2, OIDC, JWT, mutual TLS/PKI, field-level and PGP encryption, least-privilege IAM, and PCI DSS / NIST 800-53 compliance are embedded in everything I ship. On AWS I design event-driven microservices across ECS Fargate, Lambda, Step Functions, DynamoDB, SQS, and EventBridge — deployed active/active across regions with automated failover."
          - paragraph [ref=e136]: ">And I build with AI, not just talk about it. I've shipped a production LLM inference service that guides daily payment operations, authored reusable AI agent skills (Claude Code) that partner teams use to automate their workflows, and I hold AWS Solutions Architect – Professional and Google Cloud Professional Machine Learning Engineer certifications."
